<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sell Electronics - TechTraders</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
        <nav class="navbar">
            <div class="logo"><a href="index.html">Tech<span>Traders</span></a></div>
            <ul class="nav-links">
                <li><a href="index.html">Home</a></li>
                <li><a href="academics.html">Browse Devices</a></li>
                <li><a href="faculty.html" class="active">Sell Device</a></li>
                <li><a href="about.html">About Us</a></li>
                <li><a href="contact.html">Contact</a></li>
            </ul>
        </nav>
    </header>
    <main class="container">
        <h2 class="section-title">List Your Electronic Device</h2>
        <div class="form-container">
            <form action="#" method="POST">
                <div class="form-group">
                    <label for="deviceName">Device Brand & Model *</label>
                    <input type="text" id="deviceName" required placeholder="e.g. iPhone 14 Pro Max">
                </div>
                <div class="form-group">
                    <label for="category">Category *</label>
                    <select id="category" required>
                        <option value="">Select Category</option>
                        <option value="smartphone">Smartphones</option>
                        <option value="laptop">Laptops / PCs</option>
                        <option value="audio">Audio / Headphones</option>
                        <option value="other">Accessories</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="usage">How old is the device? *</label>
                    <input type="text" id="usage" required placeholder="e.g. 8 months used">
                </div>
                <div class="form-group">
                    <label for="price">Expected Price (₹) *</label>
                    <input type="number" id="price" required placeholder="e.g. 25000">
                </div>
                <div class="form-group">
                    <label for="desc">Device Condition & Specifications</label>
                    <textarea id="desc" rows="4" placeholder="Mention battery health, scratches or any minor faults..."></textarea>
                </div>
                <button type="submit" class="btn" style="width: 100%; border:none; cursor:pointer;">List Device for Sale</button>
            </form>
        </div>
    </main>
    <footer><p>&copy; 2026 TechTraders Hub. All Rights Reserved.</p></footer>
</body>
</html>
